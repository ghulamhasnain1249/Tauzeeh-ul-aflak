<!doctype html>
<html lang="en">
  <head>
    <script>
      // Ignore Vite HMR WebSocket connection errors in AI Studio iframe environment
      window.addEventListener('unhandledrejection', function(e) {
        var msg = (e.reason && (e.reason.message || e.reason.stack || String(e.reason))) || '';
        if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('createWebSocketModuleRunnerTransport')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function(e) {
        var msg = (e.message || (e.error && (e.error.message || e.error.stack)) || '') + ' ' + (e.filename || '');
        if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('createWebSocketModuleRunnerTransport')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
